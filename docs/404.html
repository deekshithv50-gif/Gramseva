    <script>
      (function () {
        var segments = window.location.pathname.split('/').filter(Boolean);
        // Safely determine repository base path on GitHub Pages
        var repoRoot = segments.length > 0 ? '/' + segments[0] + '/' : '/';
        if (window.location.pathname !== repoRoot) {
          window.location.replace(repoRoot);
        }
      })();
    </script>
